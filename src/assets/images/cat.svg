<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Body -->
  <ellipse cx="100" cy="120" rx="50" ry="55" fill="#FF9F5A"/>

  <!-- Head -->
  <circle cx="100" cy="60" r="40" fill="#FF9F5A"/>

  <!-- Left Ear -->
  <polygon points="70,20 55,10 60,40" fill="#FF9F5A"/>
  <polygon points="63,35 60,20 68,30" fill="#FFB88C"/>

  <!-- Right Ear -->
  <polygon points="130,20 145,10 140,40" fill="#FF9F5A"/>
  <polygon points="137,35 140,20 132,30" fill="#FFB88C"/>

  <!-- Left Eye -->
  <circle cx="85" cy="55" r="6" fill="#333"/>
  <circle cx="87" cy="53" r="2" fill="white"/>

  <!-- Right Eye -->
  <circle cx="115" cy="55" r="6" fill="#333"/>
  <circle cx="117" cy="53" r="2" fill="white"/>

  <!-- Nose -->
  <polygon points="100,68 95,75 105,75" fill="#FF6B9D"/>

  <!-- Mouth -->
  <path d="M 100 75 Q 95 82 88 80" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 100 75 Q 105 82 112 80" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Left Front Paw -->
  <rect x="70" y="160" width="18" height="35" rx="9" fill="#FF9F5A"/>
  <circle cx="79" cy="200" r="8" fill="#FFB88C"/>

  <!-- Right Front Paw -->
  <rect x="112" y="160" width="18" height="35" rx="9" fill="#FF9F5A"/>
  <circle cx="121" cy="200" r="8" fill="#FFB88C"/>

  <!-- Tail -->
  <path d="M 150 130 Q 170 110 175 70" stroke="#FF9F5A" stroke-width="20" fill="none" stroke-linecap="round"/>

  <!-- Whiskers -->
  <line x1="55" y1="60" x2="30" y2="55" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="55" y1="70" x2="30" y2="75" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="145" y1="60" x2="170" y2="55" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="145" y1="70" x2="170" y2="75" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
</svg>